<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Middle East Capitals Quiz</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <h1>Middle East Quiz</h1>
          <p>Hover a capital dot to answer the question.</p>
        </div>
        <div class="controls">
          <button id="reset" class="btn">Reset</button>
        </div>
      </header>

      <section class="board">
        <div class="map-wrap" id="map-wrap">
          <div id="map" aria-label="Georeferenced Middle East map"></div>
        </div>

        <aside class="quiz-panel" id="quiz-panel">
          <h2>Question</h2>
          <p id="question-text">Hover a capital dot to begin.</p>
          <div id="options" class="options"></div>
          <p id="feedback" class="feedback"></p>
          <hr />
          <p>Score: <strong id="score">0</strong></p>
          <p>Correct: <strong id="hits">0</strong></p>
          <p>Wrong: <strong id="misses">0</strong></p>
          <p>Answered: <strong id="answered">0</strong> / <strong id="total">0</strong></p>
        </aside>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="script.js"></script>
  </body>
</html>
